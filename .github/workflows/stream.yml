name: 7/24 Radyo Yayini

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Gerekli Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Yayini Baslat
        run: |
          while true; do
            ffmpeg -re -i "https://stream.zeno.fm/f3wvbbqmdg8uv" -vn -acodec libmp3lame -ab 128k -f mp3 "icecast://source:81112686dj@82.145.63.6:6274/stream"
            sleep 10
          done
