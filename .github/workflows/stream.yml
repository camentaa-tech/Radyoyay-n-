name: 7/24 Radyo Yayini

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Gerekli Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Yayini Baslat
        run: |
          while true; do
            ffmpeg -re -i "https://stream.zeno.fm/f3wvbbqmdg8uv" -vn -acodec libmp3lame -b:a 128k -content_type audio/mpeg -f mp3 "icecast://source:hackme@air.zeno.fm/live"
            sleep 10
          done
